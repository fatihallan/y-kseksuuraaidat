<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yüksek Şuura | Aidat Sistemi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><div class="logo">YS</div><div><b>Yüksek Şuura</b><small>Aidat Sistemi</small></div></div>
    <button class="nav active" data-page="home">🏠 Ana Sayfa</button>
    <button class="nav" data-page="dues">💳 Aidatlar</button>
    <button class="nav" data-page="expenses">💸 Giderler</button>
    <button class="nav" data-page="members">👥 Üyeler</button>
    <button class="nav" data-page="logs">📋 İşlem Geçmişi</button>
  </aside>
  <main>
    <header><h2 id="title">Ana Sayfa</h2><p id="subtitle">Aidat ve kasa durumunu yönetin.</p></header>
    <section id="home" class="page">
      <div class="hero"><small>YÜKSEK ŞUURA</small><h1>Aidat ve kasa yönetimi</h1><p>Tüm veriler ortak veritabanında saklanır.</p></div>
      <div id="stats" class="stats"></div>
      <div class="card"><div class="cardhead"><div><h3>Üye Durumu</h3><p>Güncel aidat özeti</p></div><button id="goDues">Aidatlara Git →</button></div><div id="homeTable"></div></div>
    </section>
    <section id="dues" class="page hidden"><div class="card"><h3>Aidat Takibi</h3><div id="periods" class="periods"></div><div id="duesTable"></div></div></section>
    <section id="expenses" class="page hidden"><div class="card"><div class="cardhead"><div><h3>Giderler</h3><p>Kasa harcamaları</p></div><button id="addExpense">+ Gider Ekle</button></div><div id="expenseTable"></div></div></section>
    <section id="members" class="page hidden"><div class="card"><div class="cardhead"><div><h3>Üyeler</h3><p>Aktif üyeler</p></div><button id="addMember">+ Üye Ekle</button></div><div id="membersList" class="members"></div></div></section>
    <section id="logs" class="page hidden"><div class="card"><h3>İşlem Geçmişi</h3><div id="logsList"></div></div></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div id="modalContent" class="modalbox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
